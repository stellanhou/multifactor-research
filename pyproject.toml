[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-quant-research"
version = "0.1.0"
description = "Personal crypto quant research and backtesting system"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.0.2",
  "pandas==2.3.3",
  "requests==2.32.5",
  "tabulate==0.9.0",
  "openai-codex==0.154.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
factor-mining = ["matplotlib==3.9.4"]
liquidation-data = [
  "cryptohftdata==0.7.0",
  "pyarrow==21.0.0",
  "zstandard==0.25.0",
]

[project.scripts]
crypto-quant = "crypto_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
